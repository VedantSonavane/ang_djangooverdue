name: Overdue sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the overdue sync endpoint
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 --retry 2 --retry-delay 15 --retry-all-errors \
            -X POST https://ang-djangooverdue.onrender.com/api/overdue/sync \
            -H "X-Service-Key: $SERVICE_KEY"
